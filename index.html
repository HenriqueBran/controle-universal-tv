<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Controle TV</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="header"><div class="identity"><div class="logo">⌁</div><strong>Controle TV</strong></div><button id="scan" class="circle-ghost" title="Buscar TVs novamente" aria-label="Buscar TVs">⟳</button></header><section class="connection"><div class="selection"><label for="device">SUA TV</label><select id="device"><option value="">Buscando TVs…</option></select></div><div class="connection-right"><div id="status" class="status"><i></i><span>Buscando…</span></div><button id="connect" class="connect" disabled>Conectar</button></div></section><section class="remote"><div class="remote-heading"><span>CONTROLE REMOTO</span><button data-key="power" class="power" aria-label="Ligar ou desligar">⏻</button></div><div class="mini-actions"><button data-key="source" aria-label="Entradas">▤ <small>Fonte</small></button><button data-key="home" aria-label="Início">⌂ <small>Início</small></button><button data-key="back" aria-label="Voltar">↶ <small>Voltar</small></button></div><div class="dpad"><button data-key="up" class="up" aria-label="Cima">⌃</button><button data-key="left" class="left" aria-label="Esquerda">‹</button><button data-key="ok" class="ok" aria-label="OK">OK</button><button data-key="right" class="right" aria-label="Direita">›</button><button data-key="down" class="down" aria-label="Baixo">⌄</button></div><div class="sound"><div class="vol"><span>VOLUME</span><div><button data-key="volume_down" aria-label="Diminuir volume">−</button><button data-key="mute" aria-label="Silenciar">◖̸</button><button data-key="volume_up" aria-label="Aumentar volume">+</button></div></div><div class="vol"><span>CANAIS</span><div><button data-key="channel_down" aria-label="Canal anterior">−</button><but
